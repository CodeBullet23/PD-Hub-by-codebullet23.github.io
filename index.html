<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Bullet — Office Hours Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        background: #0a0f1a;
        color: #e6e6e6;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    header {
        background: #0d1b2a;
        padding: 25px;
        text-align: center;
        border-bottom: 3px solid #1a4fff;
    }

    h1 {
        margin: 0;
        font-size: 32px;
        color: #1a4fff;
        text-shadow: 0 0 10px #1a4fff;
    }

    .container {
        width: 90%;
        max-width: 900px;
        margin: 30px auto;
        background: #0f1724;
        padding: 25px;
        border-radius: 10px;
        border: 1px solid #1a4fff;
        box-shadow: 0 0 20px rgba(26,79,255,0.3);
    }

    label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
    }

    input, textarea, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: none;
        background: #1b263b;
        color: white;
    }

    button {
        margin-top: 15px;
        padding: 12px 20px;
        background: #1a4fff;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #0033cc;
    }

    .request-card {
        background: #111827;
        border: 1px solid #1a4fff;
        padding: 15px;
        border-radius: 8px;
        margin-top: 15px;
    }

    .status {
        margin-top: 10px;
        font-weight: bold;
    }

    .accept-btn {
        background: #00c853;
    }
    .accept-btn:hover {
        background: #009624;
    }

    .deny-btn {
        background: #ff3b3b;
    }
    .deny-btn:hover {
        background: #cc0000;
    }

    .calendar-day {
        padding: 10px;
        margin: 5px;
        display: inline-block;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid #1a4fff;
    }

    .available {
        background: #1a4fff;
    }

    .unavailable {
        background: #3b3b3b;
    }
</style>
</head>

<body>

<header>
    <h1>Code Bullet — Office Hours Hub</h1>
</header>

<div class="container">
    <h2>Available Days</h2>
    <p>Click a day to toggle between AVAILABLE and UNAVAILABLE.</p>

    <div id="calendar"></div>

    <hr style="margin:30px 0; border-color:#1a4fff;">

    <h2>Request Office Hours</h2>
    <p>Pick a day that is marked AVAILABLE.</p>

    <label>Name</label>
    <input id="name">

    <label>Discord Username</label>
    <input id="discord">

    <label>Topic / Reason</label>
    <textarea id="topic" rows="4"></textarea>

    <label>Select Day</label>
    <select id="day"></select>

    <label>Preferred Time</label>
    <input id="time">

    <button onclick="submitRequest()">Submit Request</button>

    <h2 style="margin-top:40px;">Submitted Requests</h2>
    <div id="requests"></div>
</div>

<script>
    const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

    function loadCalendar() {
        const calendar = document.getElementById("calendar");
        calendar.innerHTML = "";

        let status = JSON.parse(localStorage.getItem("dayStatus") || "{}");

        days.forEach(day => {
            if (!status[day]) status[day] = "available";

            const div = document.createElement("div");
            div.className = "calendar-day " + (status[day] === "available" ? "available" : "unavailable");
            div.innerText = day;

            div.onclick = () => {
                status[day] = status[day] === "available" ? "unavailable" : "available";
                localStorage.setItem("dayStatus", JSON.stringify(status));
                loadCalendar();
                loadDayDropdown();
            };

            calendar.appendChild(div);
        });
    }

    function loadDayDropdown() {
        const dropdown = document.getElementById("day");
        dropdown.innerHTML = "";

        let status = JSON.parse(localStorage.getItem("dayStatus") || "{}");

        days.forEach(day => {
            if (status[day] === "available") {
                const opt = document.createElement("option");
                opt.value = day;
                opt.innerText = day;
                dropdown.appendChild(opt);
            }
        });
    }

    function submitRequest() {
        const name = document.getElementById("name").value;
        const discord = document.getElementById("discord").value;
        const topic = document.getElementById("topic").value;
        const day = document.getElementById("day").value;
        const time = document.getElementById("time").value;

        if (!name || !discord || !topic || !day || !time) {
            alert("Please fill out all fields.");
            return;
        }

        const request = { name, discord, topic, day, time, status: "Pending" };
        let list = JSON.parse(localStorage.getItem("officeRequests") || "[]");
        list.push(request);
        localStorage.setItem("officeRequests", JSON.stringify(list));

        loadRequests();
        alert("Request submitted.");
    }

    function loadRequests() {
        const container = document.getElementById("requests");
        container.innerHTML = "";

        let list = JSON.parse(localStorage.getItem("officeRequests") || "[]");

        list.forEach((req, index) => {
            const card = document.createElement("div");
            card.className = "request-card";
            card.innerHTML = `
                <strong>Name:</strong> ${req.name}<br>
                <strong>Discord:</strong> ${req.discord}<br>
                <strong>Topic:</strong> ${req.topic}<br>
                <strong>Day:</strong> ${req.day}<br>
                <strong>Time:</strong> ${req.time}<br>
                <div class="status">Status: ${req.status}</div>
                <button class="accept-btn" onclick="updateStatus(${index}, 'Accepted')">Accept</button>
                <button class="deny-btn" onclick="updateStatus(${index}, 'Denied')">Deny</button>
            `;
            container.appendChild(card);
        });
    }

    function updateStatus(index, newStatus) {
        let list = JSON.parse(localStorage.getItem("officeRequests") || "[]");
        list[index].status = newStatus;
        localStorage.setItem("officeRequests", JSON.stringify(list));
        loadRequests();
    }

    loadCalendar();
    loadDayDropdown();
    loadRequests();
</script>

</body>
</html>
